[run]
action = search

[data]
vectors = ../gem_data/evqa/docdata/encoding{shard}_float16.npy
lengths = ../gem_data/evqa/docdata/doclens{shard}.npy
codes = ../gem_data/evqa/docdata/{shard}.codes.npy
shards = 3
fine_centroids = ../gem_data/evqa/cdata/centroids.npy
graph_centroids = ../gem_data/evqa/cdata/coarse_centroids.npy
clusters = ../gem_data/evqa/cdata/coarse_cluster_info.txt

[index]
path = ../example_index/evqaIndex1024_all_24_80/0.bin

[query]
vectors = ../gem_data/evqa/qdata/filterd_query.npy
lengths = ../gem_data/evqa/qdata/filterd_query_len.npy
qrels = ../gem_data/evqa/qdata/qrels.tsv
limit = 0

[build]
m = 24
ef_construction = 80
seed = 100
distance_budget_bytes = 4294967296

[search]
nprobe = 4
ef = 4000
rerank_k = 512
k = 100

[runtime]
workers = 1
inner_threads = 1

[benchmark]
warmup = 1
repeats = 3
